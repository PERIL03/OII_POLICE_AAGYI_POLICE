services:
  # Express API Web Service + Socket.IO + Embedded Ingestion Worker (100% Free Tier)
  - type: web
    name: cryptotrace-api
    env: node
    region: singapore
    plan: free
    buildCommand: npm install --production=false && npm run build --workspace=shared && npx prisma generate --schema=prisma/schema.prisma
    startCommand: npx prisma migrate deploy --schema=prisma/schema.prisma && node backend/dist/index.js
    envVars:
      - key: NODE_VERSION
        value: 20.11.0
      - key: DATABASE_URL
        fromDatabase:
          name: cryptotrace-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 4000
      - key: FRONTEND_ORIGIN
        value: https://cryptotrace-rishu-rajs-projects-d7b03cac.vercel.app,http://localhost:3000
      - key: ETHERSCAN_API_KEY
        sync: false
      - key: REDIS_URL
        sync: false

databases:
  # Render Managed PostgreSQL (100% Free Tier)
  - name: cryptotrace-db
    databaseName: cryptotrace
    plan: free
    region: singapore
