services:
  # Express API Web Service + Socket.IO
  - type: web
    name: cryptotrace-api
    env: node
    region: singapore
    plan: starter
    buildCommand: npm ci && npm run build --workspace=shared && npm run build --workspace=backend
    startCommand: npm run start --workspace=backend
    envVars:
      - key: NODE_VERSION
        value: 20.11.0
      - key: DATABASE_URL
        fromDatabase:
          name: cryptotrace-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: cryptotrace-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 4000
      - key: FRONTEND_ORIGIN
        value: https://cryptotrace-frontend.vercel.app,http://localhost:3000

  # Render Background Ingestion Worker
  - type: worker
    name: cryptotrace-worker
    env: node
    region: singapore
    plan: starter
    buildCommand: npm ci && npm run build --workspace=shared && npm run build --workspace=worker
    startCommand: npm run start --workspace=worker
    envVars:
      - key: NODE_VERSION
        value: 20.11.0
      - key: DATABASE_URL
        fromDatabase:
          name: cryptotrace-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: cryptotrace-redis
          property: connectionString

databases:
  # Render Managed PostgreSQL
  - name: cryptotrace-db
    databaseName: cryptotrace
    plan: starter
    region: singapore

  # Render Managed Redis
  - name: cryptotrace-redis
    plan: starter
    region: singapore
