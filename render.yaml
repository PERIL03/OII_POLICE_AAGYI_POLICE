services:
  # Express API Web Service + Socket.IO + Embedded Ingestion Worker (100% Free Tier)
  - type: web
    name: cryptotrace-api
    env: node
    region: singapore
    plan: free
    buildCommand: npm install && cp -r shared/src backend/src/shared && npx prisma generate --schema=prisma/schema.prisma && npx tsc -p backend/tsconfig.json
    startCommand: npx prisma migrate deploy --schema=prisma/schema.prisma && node backend/dist/index.js
    envVars:
      - key: NODE_VERSION
        value: 20.11.0
      - key: DATABASE_URL
        fromDatabase:
          name: cryptotrace-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 4000
      - key: FRONTEND_ORIGIN
        value: https://cryptotrace-frontend.vercel.app,http://localhost:3000

databases:
  # Render Managed PostgreSQL (100% Free Tier)
  - name: cryptotrace-db
    databaseName: cryptotrace
    plan: free
    region: singapore
